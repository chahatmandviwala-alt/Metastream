<!DOCTYPE html>

<html lang="en">
<head>

<script>
(function () {
  // Only apply fixes when running inside Android WebView assets
  const isAndroidAsset =
    location.protocol === "file:" &&
    location.pathname.includes("/android_asset/");

  if (!isAndroidAsset) return;

  // Force relative URLs like "tabs/xyz.html" to resolve to:
  // file:///android_asset/tabs/xyz.html
  const base = document.createElement("base");
  base.href = "file:///android_asset/";
  document.head.appendChild(base);
})();
</script>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metastream</title>
<link rel="icon" href="tabs/docs/app_icon.png">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
  <aside id="sidebar" class="sidebar" aria-label="Workspace sidebar">
    <button class="brand" type="button" data-tab="home" aria-label="Metastream home" title="Metastream home">
      <img src="tabs/docs/app_icon.png" alt="" width="40" height="40">
      <span>Metastream</span>
    </button>
    <nav id="workspaceNav" aria-label="Workspace">
      <div class="nav-caption">Workspace</div>
      <button class="nav-item" type="button" data-tab="home" aria-label="Home" aria-current="page" title="Home">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#home"/></svg><span>Home</span>
      </button>
      <div class="nav-caption tools-caption">Tools</div>
      <div id="toolNav"></div>
    </nav>
    <button type="button" class="collapse-btn" id="toggleBtn" aria-controls="workspaceNav" aria-expanded="true" title="Collapse sidebar">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#panel"/></svg><span>Collapse sidebar</span>
    </button>
  </aside>
  <header class="topbar">
    <div class="mobile-brand"><img src="tabs/docs/app_icon.png" alt="">Metastream</div>
    <div class="location">
      <span class="workspace-crumb"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#grid"/></svg> Workspace</span>
      <button class="home-link" type="button" data-tab="home"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#back"/></svg> Home</button>
      <svg class="crumb-divider" aria-hidden="true"><use href="assets/icons.svg#chevron"/></svg>
      <span id="pageTitle" tabindex="-1">Home</span>
    </div>
    <div class="utilities">
      <button class="utility" type="button" id="vkToggleBtn" aria-controls="vk" aria-pressed="false" aria-label="Virtual keyboard" title="Virtual keyboard">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#keyboard"/></svg><span>Keyboard</span>
      </button>
      <button class="utility exit" type="button" onclick="clearAndClose()" aria-label="Clear session and exit" title="Clear session and exit">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#exit"/></svg><span>Exit</span>
      </button>
    </div>
  </header>
  <main class="content">
    <section class="home tab-content active" id="home" aria-labelledby="homeTitle">
      <div class="home-inner">
        <header class="hero">
          <div class="hero-copy">
            <div class="eyebrow"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chip"/></svg> Air-gapped wallet</div>
            <h1 id="homeTitle">Offline workspace</h1>
            <p>Create wallets, manage keys, and sign EVM transactions offline.</p>
          </div>
          <img class="hero-art" src="assets/workspace-board.svg" alt="">
        </header>
        <h2 id="toolsTitle">Wallet tools</h2>
        <div class="tool-grid" aria-labelledby="toolsTitle">
        <button type="button" class="tool-card" data-tab="newWallet" aria-labelledby="name-newWallet" aria-describedby="desc-newWallet">
          <span class="tool-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#wallet"/></svg></span>
          <svg class="card-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"/></svg>
          <span class="tool-name" id="name-newWallet">New wallet</span>
          <span class="tool-desc" id="desc-newWallet">Generate a seed phrase and create an Ethereum wallet.</span>
        </button>
        <button type="button" class="tool-card" data-tab="diceware" aria-labelledby="name-diceware" aria-describedby="desc-diceware">
          <span class="tool-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#dice"/></svg></span>
          <svg class="card-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"/></svg>
          <span class="tool-name" id="name-diceware">Dice &amp; coin</span>
          <span class="tool-desc" id="desc-diceware">Build a seed phrase from dice rolls and coin flips.</span>
        </button>
        <button type="button" class="tool-card" data-tab="keystoreTool" aria-labelledby="name-keystoreTool" aria-describedby="desc-keystoreTool">
          <span class="tool-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#key"/></svg></span>
          <svg class="card-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"/></svg>
          <span class="tool-name" id="name-keystoreTool">Keystore tool</span>
          <span class="tool-desc" id="desc-keystoreTool">Encrypt or unlock a wallet with a keystore file.</span>
        </button>
        <button type="button" class="tool-card" data-tab="connect" aria-labelledby="name-connect" aria-describedby="desc-connect">
          <span class="tool-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#connect"/></svg></span>
          <svg class="card-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"/></svg>
          <span class="tool-name" id="name-connect">Connect wallet</span>
          <span class="tool-desc" id="desc-connect">Pair with MetaMask or Rabby using a QR code.</span>
        </button>
        <button type="button" class="tool-card" data-tab="sign" aria-labelledby="name-sign" aria-describedby="desc-sign">
          <span class="tool-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#sign"/></svg></span>
          <svg class="card-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"/></svg>
          <span class="tool-name" id="name-sign">Sign transaction</span>
          <span class="tool-desc" id="desc-sign">Review a request and return a signed QR code.</span>
        </button>
        <button type="button" class="tool-card" data-tab="info" aria-labelledby="name-info" aria-describedby="desc-info">
          <span class="tool-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#guide"/></svg></span>
          <svg class="card-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"/></svg>
          <span class="tool-name" id="name-info">User guide</span>
          <span class="tool-desc" id="desc-info">Read walkthroughs, security notes, and app information.</span>
        </button>
        </div>
        <aside class="airgap-note" aria-label="Air-gap reminder">
          <span class="note-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#shield"/></svg></span>
          <div><strong>Keep this device air-gapped</strong><p>Disconnect Wi-Fi, Bluetooth, and Ethernet before working with your keys.</p></div>
          <button class="guide-link" data-tab="info" type="button">Read guide <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#arrow"/></svg></button>
        </aside>
      </div>
    </section>
    <iframe class="tab-content" id="newWallet" src="tabs/new-wallet.html" title="New wallet"></iframe>
    <iframe class="tab-content" id="diceware" src="tabs/diceware.html" title="Dice &amp; coin"></iframe>
    <iframe class="tab-content" id="keystoreTool" src="tabs/keystore-tool.html" title="Keystore tool"></iframe>
    <iframe class="tab-content" id="connect" src="tabs/connect.html" title="Connect wallet"></iframe>
    <iframe class="tab-content" id="sign" src="tabs/sign.html" title="Sign transaction"></iframe>
    <iframe class="tab-content" id="info" src="tabs/info.html" title="User guide"></iframe>
  </main>

<!-- Floating Virtual Keyboard -->
<div class="vk hidden" id="vk" aria-hidden="true">
  <div class="vk-header" id="vkHeader">
    <div class="vk-title">Virtual Keyboard</div>
    <div class="vk-actions">
      <button class="vk-action" id="vkMinBtn" type="button" aria-controls="vkBody" aria-expanded="true" title="Minimize/Expand" aria-label="Minimize/Expand">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="vk-action" id="vkCloseBtn" type="button" title="Close" aria-label="Close">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="vk-body" id="vkBody">
    <div class="vk-row">
      <button class="vk-key" data-normal="`" data-shift="~" type="button">`</button>
      <button class="vk-key" data-normal="1" data-shift="!" type="button">1</button>
      <button class="vk-key" data-normal="2" data-shift="@" type="button">2</button>
      <button class="vk-key" data-normal="3" data-shift="#" type="button">3</button>
      <button class="vk-key" data-normal="4" data-shift="$" type="button">4</button>
      <button class="vk-key" data-normal="5" data-shift="%" type="button">5</button>
      <button class="vk-key" data-normal="6" data-shift="^" type="button">6</button>
      <button class="vk-key" data-normal="7" data-shift="&amp;" type="button">7</button>
      <button class="vk-key" data-normal="8" data-shift="*" type="button">8</button>
      <button class="vk-key" data-normal="9" data-shift="(" type="button">9</button>
      <button class="vk-key" data-normal="0" data-shift=")" type="button">0</button>
      <button class="vk-key" data-normal="-" data-shift="_" type="button">-</button>
      <button class="vk-key" data-normal="=" data-shift="+" type="button">=</button>
      
	  <button class="vk-key wider" data-action="backspace" type="button" aria-label="Backspace" title="Backspace">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
    <path d="M21 12H10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 7 5 12l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 7v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.0"/>
  </svg>
</button>

    </div>

    <div class="vk-row">
      
	 <button class="vk-key wide" data-action="tab" type="button" aria-label="Tab" title="Tab">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
    <path d="M4 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 8l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 6v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

      
	  <button class="vk-key" data-letter="q" type="button">q</button>
      <button class="vk-key" data-letter="w" type="button">w</button>
      <button class="vk-key" data-letter="e" type="button">e</button>
      <button class="vk-key" data-letter="r" type="button">r</button>
      <button class="vk-key" data-letter="t" type="button">t</button>
      <button class="vk-key" data-letter="y" type="button">y</button>
      <button class="vk-key" data-letter="u" type="button">u</button>
      <button class="vk-key" data-letter="i" type="button">i</button>
      <button class="vk-key" data-letter="o" type="button">o</button>
      <button class="vk-key" data-letter="p" type="button">p</button>
      <button class="vk-key" data-normal="[" data-shift="{" type="button">[</button>
      <button class="vk-key" data-normal="]" data-shift="}" type="button">]</button>
      <button class="vk-key" data-normal="\\" data-shift="|" type="button">\</button>
    </div>

    <div class="vk-row">
      
	  <button class="vk-key wider" data-action="caps" type="button" aria-label="Caps Lock" title="Caps Lock">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
    <path d="M12 4 5 11h14L12 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

      
	  <button class="vk-key" data-letter="a" type="button">a</button>
      <button class="vk-key" data-letter="s" type="button">s</button>
      <button class="vk-key" data-letter="d" type="button">d</button>
      <button class="vk-key" data-letter="f" type="button">f</button>
      <button class="vk-key" data-letter="g" type="button">g</button>
      <button class="vk-key" data-letter="h" type="button">h</button>
      <button class="vk-key" data-letter="j" type="button">j</button>
      <button class="vk-key" data-letter="k" type="button">k</button>
      <button class="vk-key" data-letter="l" type="button">l</button>
      <button class="vk-key" data-normal=";" data-shift=":" type="button">;</button>
      <button class="vk-key" data-normal="'" data-shift="&quot;" type="button">'</button>
<button class="vk-key wider" data-action="enter" type="button"
        aria-label="Enter" title="Enter">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
    <!-- return arrow: corner down-left -->
    <path d="M9 10l-4 4 4 4"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 4v6a4 4 0 0 1-4 4H5"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>


    </div>

    <div class="vk-row">
      
	  <button class="vk-key wider" data-action="shift" type="button" aria-label="Shift" title="Shift">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
    <path d="M12 4 6 10h4v6h4v-6h4l-6-6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </svg>
</button>

      
	  <button class="vk-key" data-letter="z" type="button">z</button>
      <button class="vk-key" data-letter="x" type="button">x</button>
      <button class="vk-key" data-letter="c" type="button">c</button>
      <button class="vk-key" data-letter="v" type="button">v</button>
      <button class="vk-key" data-letter="b" type="button">b</button>
      <button class="vk-key" data-letter="n" type="button">n</button>
      <button class="vk-key" data-letter="m" type="button">m</button>
      <button class="vk-key" data-normal="," data-shift="&lt;" type="button">,</button>
      <button class="vk-key" data-normal="." data-shift="&gt;" type="button">.</button>
      <button class="vk-key" data-normal="/" data-shift="?" type="button">/</button>
	  
      <button class="vk-key wider" data-action="shift" type="button" aria-label="Shift" title="Shift">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
    <path d="M12 4 6 10h4v6h4v-6h4l-6-6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </svg>
</button>

	  
    </div>

    <div class="vk-row">
      <button class="vk-key wide" data-action="esc" type="button">Esc</button>
      <button class="vk-key wide" data-action="left" type="button" aria-label="Move cursor left">←</button>
      <button class="vk-key space" data-action="space" type="button">Space</button>
      <button class="vk-key wide" data-action="right" type="button" aria-label="Move cursor right">→</button>
      <button class="vk-key wide" data-action="del" type="button">Del</button>
    </div>
  </div>
</div>
<script src="shell.js"></script>
</body>
</html>
