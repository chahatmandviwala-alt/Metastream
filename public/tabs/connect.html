<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wallet Connect</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../layout.js" defer></script>
</head>
<body data-tab="connect">
  <div class="wrap">
    <header class="tool-header">
      <span class="tool-icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#connect"/></svg></span>
      <div><h1>Connect wallet</h1><p>Pair with MetaMask or Rabby by sharing your wallet’s public key as a QR code.</p></div>
    </header>

    <div class="tool-stage" data-fit>
    <div class="pairing-form">
      <!-- TOP: full-width input block -->
      <section class="section" id="input-block">
        <div class="field">
          <div class="label-row">
            <label for="mnemonic" class="field-label">Seed phrase</label>
            <button type="button" id="toggleMnemonic" class="text-toggle">Show</button>
          </div>

          <textarea
            id="mnemonic"
            placeholder="Enter your 12/15/18/21/24 word mnemonic seed phrase"
            data-hidden="true"
          ></textarea>
        </div>
		
<div class="row-controls">
<div class="field">
  <div class="label-row">
    <label for="passphrase" class="field-label">
      Passphrase
      <span class="info-icon" tabindex="0" aria-label="Passphrase information">
        ⓘ
        <span class="tooltip">
          Leave it blank if you do not know what a passphrase is.
        </span>
      </span>
    </label>

    <button type="button" id="togglePassphrase" class="text-toggle">Show</button>
  </div>

  <input id="passphrase" type="password" placeholder="Enter passphrase (optional)" />
</div>


  <div>
    <label for="path" class="label-with-info">
  Derivation path
  <span class="info-icon" tabindex="0" aria-label="Derivation path information">
    ⓘ
    <span class="tooltip">
      Default path for connecting Ethereum wallets is <code>m/44'/60'/0'</code>.
      Do not change if you do not know what a derivation path is.
    </span>
  </span>
</label>

    <input id="path" type="text" value="m/44'/60'/0'" />
  </div>

  <div class="confirm-wrap">
    <button id="go" class="btn">Connect</button>
    <button id="viewPairing" data-dialog="pairingDialog" aria-haspopup="dialog" class="btn secondary" hidden>Show QR</button>
  </div>
</div>

<div id="err" role="status"></div>
      </section>

      <div id="security-warning" class="warning">
        <strong>Security Note:</strong> Use this tool on an air-gapped machine for maximum security.
      </div>
    </div>
  </div>
  </div>
  <dialog class="tool-dialog" id="pairingDialog" aria-labelledby="pairingDialogTitle">
    <header class="dialog-header">
      <h2 id="pairingDialogTitle">Connect wallet</h2>
      <form method="dialog"><button class="dialog-close" aria-label="Close connect wallet" title="Close" autofocus>×</button></form>
    </header>
    <div class="dialog-body">
      <img id="qr" alt="Wallet pairing QR code">
      <h3 class="payload-label">UR:CRYPTO-HDKEY</h3>
      <div id="ur" class="codebox mono"></div>
      <div class="flex">
        <button id="savePng" class="btn">Download QR</button>
        <button id="saveTxt" class="btn secondary">Download UR</button>
      </div>
      <p class="footnote">In MetaMask or Rabby, add a QR-based hardware wallet and scan this code.</p>
    </div>
  </dialog>

<script>
  async function gen() {
    const connectButton = document.getElementById('go');
    connectButton.disabled = true;
    const form = document.getElementById('input-block');
    form.inert = true;
    setErr('');
    try {
      const mnemonic = get('mnemonic').trim();
      if (!mnemonic) {
        setErr('Please enter your seedphrase before confirming.');
        return;
      }

      const body = {
        mnemonic:  mnemonic,
        passphrase:get('passphrase'),
        path:      get('path').trim()
      };

      const resp = await fetch('/api/gen', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Unknown error');

      
	  // We no longer display path / FP details, only UR + QR
      set('ur', data.ur);
      document.getElementById('qr').src = data.qrDataUrl;
      window.__lastUR = data.ur; 
      window.__lastQR = data.qrDataUrl;

      // SECURITY: clear sensitive inputs after successful generation
      document.getElementById('mnemonic').value = '';
      // Optional: also clear passphrase if you want
      // document.getElementById('passphrase').value = '';

      document.getElementById('security-warning').hidden = true;
      const viewPairing = document.getElementById('viewPairing');
      form.inert = false;
      viewPairing.hidden = false;
      viewPairing.focus();
      document.getElementById('pairingDialog').showModal();
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      connectButton.disabled = false;
      form.inert = false;
    }
  }
  function set(id, v){ document.getElementById(id).textContent = v; }
  function get(id){ return document.getElementById(id).value; }
  function setErr(t){ document.getElementById('err').textContent = t; }
  function attachButtonToggle(inputId, buttonId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(buttonId);
  if (!input || !btn) return;

  btn.addEventListener("click", () => {
    const visible = input.type === "text";
    input.type = visible ? "password" : "text";
    btn.textContent = visible ? "Show" : "Hide";
  });
}

  function attachTextareaToggle(textareaId, buttonId) {
    const ta = document.getElementById(textareaId);
    const btn = document.getElementById(buttonId);
    if (!ta || !btn) return;

    // start hidden
    ta.style.webkitTextSecurity = "disc";

    btn.addEventListener("click", () => {
      const hidden = ta.style.webkitTextSecurity === "disc";
      ta.style.webkitTextSecurity = hidden ? "none" : "disc";
      btn.textContent = hidden ? "Hide" : "Show";
    });
  }

  attachButtonToggle("passphrase", "togglePassphrase");
  attachTextareaToggle("mnemonic", "toggleMnemonic");


  document.getElementById('go').addEventListener('click', gen);
  document.getElementById('input-block').addEventListener('input', () => {
    document.getElementById('viewPairing').hidden = true;
    document.getElementById('security-warning').hidden = false;
    setErr('');
  });
  document.getElementById('saveTxt').addEventListener('click', () => {
    if (!window.__lastUR) return;
    const a = document.createElement('a');
    a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(window.__lastUR);
    a.download = 'ur.txt'; a.click();
  });
  document.getElementById('savePng').addEventListener('click', () => {
    if (!window.__lastQR) return;
    const a = document.createElement('a');
    a.href = window.__lastQR; a.download = 'ur.png'; a.click();
  });
</script>
</body>
</html>
